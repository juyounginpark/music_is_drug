	color: white;

		<script>
/* Installed before Godot creates its context. Resume must run in a DOM gesture,
   rather than waiting for a GDScript frame after the browser's activation ends. */
(() => {
  'use strict';
  const contexts = new Set();
  let gameReady = false;
  let hasPlayed = false;
  let primed = false;
  let gate;
  let menuMode = false;
  let pausedAt = performance.now();
  let pausedTotal = 0;
  function routePlayback() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  }
  routePlayback();
  const running = () => contexts.size > 0 && [...contexts].every(c => c.state === 'running');
  const ready = () => running() && !document.hidden;
  function pausedSeconds() {
    return pausedTotal + (pausedAt === null ? 0 : (performance.now() - pausedAt) / 1000);
  }
  function refresh() {
    const canPlay = ready();
    if (!canPlay && pausedAt === null) pausedAt = performance.now();
    if (canPlay && pausedAt !== null) {
      pausedTotal += (performance.now() - pausedAt) / 1000;
      pausedAt = null;
    }
    if (!gameReady || !gate) return;
    gate.hidden = canPlay || menuMode;
    gate.textContent = hasPlayed ? 'TAP TO RESUME' : 'TAP TO PLAY';
    if (canPlay) hasPlayed = true;
  }
  const constructors = new Map();
  for (const name of ['AudioContext', 'webkitAudioContext']) {
    const Native = window[name];
    if (!Native) continue;
    if (!constructors.has(Native)) {
      constructors.set(Native, class extends Native {
        constructor(...args) {
          super(...args);
          contexts.add(this);
          this.addEventListener('statechange', refresh);
          refresh();
        }
      });
    }
    window[name] = constructors.get(Native);
  }
  function unlock() {
    // Supported iOS versions can route game audio through the playback category.
    routePlayback();
    for (const context of contexts) {
      if (context.state === 'closed') continue;
      try {
        context.resume().then(refresh).catch(refresh);
        // One silent frame primes iOS output without an audible click.
        const source = context.createBufferSource();
        source.buffer = context.createBuffer(1, 1, context.sampleRate);
        source.connect(context.destination);
        source.onended = () => source.disconnect();
        source.start(0);
        primed = true;
      } catch (_) { /* Another trusted gesture can retry an interrupted context. */ }
    }
    refresh();
  }
  for (const event of ['pointerdown', 'touchstart', 'touchend', 'keydown']) {
    window.addEventListener(event, () => { if (!primed || !running()) unlock(); }, {capture: true, passive: true});
  }
  document.addEventListener('visibilitychange', refresh);
  window.StringArtAudio = {
    isRunning: ready,
    pausedSeconds,
    setMenuMode(enabled) { menuMode = !!enabled; refresh(); },
    unlock,
    setGameReady() {
      gameReady = true;
      gate = document.createElement('button');
      gate.id = 'audio-start';
      gate.type = 'button';
      gate.setAttribute('aria-label', 'Start game audio');
      Object.assign(gate.style, {
        position: 'fixed', inset: '0', width: '100%', height: '100%',
        zIndex: '10', border: '0', color: '#f8d78a', background: '#061f29e8',
        font: 'bold 22px monospace', letterSpacing: '3px', touchAction: 'none',
        cursor: 'pointer'
      });
      // The start/resume tap activates sound; it must not also connect a pin.
      for (const event of ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown']) {
        gate.addEventListener(event, e => { e.preventDefault(); e.stopPropagation(); unlock(); }, {passive: false});
      }
      document.body.appendChild(gate);
      refresh();
    }
  };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"STRING ART","experimentalVK":false,"fileSizes":{"STRING ART.pck":229588,"STRING ART.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.StringArtAudio.setGameReady();
		}, displayFailureNotice);
	}
}());
